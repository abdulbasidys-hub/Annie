# Local infrastructure only. Firestore is a managed cloud service and has no
# local container — see the Firestore emulator note in README if you want one
# for offline development. Redis is optional in this deployment: no
# background worker reads from it yet (see README's "picking up the
# unfinished work"), so this is here for when that lands, not required today.
#
#   docker compose up -d
#
# Then point REDIS_URL at it.

services:
  redis:
    image: redis:7-alpine
    container_name: annie-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - annie-redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  annie-redisdata:
