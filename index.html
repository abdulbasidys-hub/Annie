<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark light" />
    <meta name="description" content="Solana memecoin intelligence and research system." />
    <link rel="icon" type="image/jpeg" href="/Annie.jpg" />
    <title>Annie</title>
    <script>
      // Applied before first paint so the shell never flashes the wrong theme.
      // Reads the stored choice, falling back to the OS preference.
      (function () {
        try {
          var stored = localStorage.getItem('annie.theme')
          var theme = stored || (window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark')
          document.documentElement.setAttribute('data-theme', theme)
        } catch (e) {
          document.documentElement.setAttribute('data-theme', 'dark')
        }
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
